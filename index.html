<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedCare Rural - Complete Hospital Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="/src/main.css" rel="stylesheet" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="Complete Hospital Management System for Rural Healthcare" />
    <link rel="manifest" href="/manifest.json" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration (disabled when offline functionality is disabled) -->
    <script>
        // Service Worker is disabled when offline functionality is turned off
        // This can be controlled via the VITE_OFFLINE_ENABLED environment variable
        const shouldRegisterSW = window.location.search.includes('enableSW=true');

        if ('serviceWorker' in navigator && shouldRegisterSW) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered successfully:', registration.scope);

                        // Listen for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New version available
                                    if (confirm('A new version is available. Reload to update?')) {
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });

            // Handle service worker messages
            navigator.serviceWorker.addEventListener('message', (event) => {
                const { type, action } = event.data;

                if (type === 'BACKGROUND_SYNC' && action === 'PERFORM_SYNC') {
                    // Trigger sync in the app
                    window.dispatchEvent(new CustomEvent('service-worker-sync'));
                }
            });
        } else {
            console.log('Service Worker disabled - offline functionality is turned off');
        }
    </script>
</body>

</html>
